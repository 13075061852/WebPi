  <path d="M938-100C976 134 1108 310 1308 405C1446 471 1591 504 1770 419" stroke="white" stroke-opacity=".78" stroke-width="1.4"/>
  <path d="M1030-100C1087 120 1245 290 1431 340C1542 369 1663 352 1760 300" stroke="white" stroke-opacity=".68" stroke-width="1.2"/>
  <path d="M995 38C1083 238 1230 374 1420 419" stroke="white" stroke-opacity=".44" stroke-width="6" filter="url(#caustic)"/>

  <!-- Two slim, overlapping folds carry the lower edge reflection. -->
  <path d="M-170 670C128 867 418 908 733 821C1012 744 1301 812 1730 1015L1740 1130C1287 911 995 852 718 934C377 1035 75 955-170 799Z" fill="url(#lowerGlass)" filter="url(#lift)"/>
  <path d="M-170 670C128 867 418 908 733 821C1012 744 1301 812 1730 1015" stroke="url(#rim)" stroke-width="1.8"/>
  <path d="M-170 673C128 870 418 911 733 824C1012 747 1301 815 1730 1018" stroke="#7b7b7b" stroke-opacity=".14" stroke-width=".8"/>
  <path d="M-170 799C75 955 377 1035 718 934C995 852 1287 911 1740 1130" stroke="white" stroke-opacity=".70" stroke-width="1.3"/>
  <path d="M-170 815C96 979 397 1017 725 921C1001 840 1295 913 1740 1120" stroke="white" stroke-opacity=".5" stroke-width="5" filter="url(#caustic)"/>
  <path d="M-150 913C112 1080 480 1127 870 1000C1086 930 1301 946 1630 1080" stroke="white" stroke-opacity=".4" stroke-width="1.5"/>
</svg>

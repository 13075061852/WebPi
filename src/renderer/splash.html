<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'" />
  <title>Pi Halo</title>
  <script src="js/theme-catalog.js"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/theme-scenic.css" />
  <link rel="stylesheet" href="css/theme-collection.css" />
  <link rel="stylesheet" href="css/splash.css" />
</head>
<body>
  <main id="stage" aria-label="Pi Halo 启动中">
    <section class="identity" aria-labelledby="heroTitle">
      <div class="logo-tile">
        <svg class="emblem" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M16 22h32M24 22l-3 25m19-25v19q0 7 7 4" />
        </svg>
      </div>
      <h1 id="heroTitle">星环</h1>
      <p>PI HALO</p>
    </section>
    <footer>
      <div class="status-line"><span class="loading" aria-hidden="true"></span><span id="status" role="status">正在启动</span></div>
      <p id="startupDetail" hidden></p>
      <span id="elapsed" hidden></span>
    </footer>
  </main>
  <script src="js/splash.js"></script>
</body>
</html>

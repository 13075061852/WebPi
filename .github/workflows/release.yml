name: Windows release
on:
  # Local Windows builds are the default. Cloud builds require explicit dispatch.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build or reverify
        required: true
        type: string
      reuse_run:
        description: Optional prior run ID with a successful build; reuse installer bytes
        required: false
        type: string
permissions:
  contents: write
  actions: read
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Validate release version
        run: |
          node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version) throw Error('Tag must match package.json version')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A manual retry may use newer CI/tests, but every shipped input must
          # remain identical to the existing tag. Never move a release tag.
          git diff --exit-code $env:RELEASE_TAG HEAD -- src assets package.json package-lock.json build
          if ($LASTEXITCODE -ne 0) { throw 'Shipped inputs differ from the release tag' }
      - name: Validate reusable installer source
        if: inputs.reuse_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: node scripts/validate-release-reuse.mjs
      - name: Restore prior candidate installer
        if: inputs.reuse_run != ''
        uses: actions/download-artifact@v4
        with:
          name: windows-candidate-installer
          path: dist
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
      - uses: ./.github/actions/windows-dependencies
        if: inputs.reuse_run == ''
      - name: Provide a verified Chinese TrueType font
        if: inputs.reuse_run == ''
        run: |
          $ErrorActionPreference = 'Stop'
          $fontPath = Join-Path $env:RUNNER_TEMP 'NotoSansSC.ttf'
          # Official Google Fonts file pinned to an immutable commit and content hash.
          $fontUrl = 'https://raw.githubusercontent.com/google/fonts/2894aab31764f10f29c421bdfd2340d3b382d384/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf'
          Invoke-WebRequest -Uri $fontUrl -OutFile $fontPath
          if ((Get-FileHash -LiteralPath $fontPath -Algorithm SHA256).Hash -ne 'a3041811a78c361b1de50f953c805e0244951c21c5bd412f7232ef0d899af0da') { throw 'Chinese font checksum mismatch' }
          $env:HALO_DOCUMENT_FONT = $fontPath
          node -e "const font=require('fontkit').openSync(process.env.HALO_DOCUMENT_FONT); for(const c of '项目报告数据准确版式清晰文件可编辑') if(!font.hasGlyphForCodePoint(c.codePointAt(0))) throw Error('Chinese font glyph missing'); console.log('Verified Chinese TrueType font')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "HALO_DOCUMENT_FONT=$fontPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Warm the isolated Windows PowerShell runtime
        if: inputs.reuse_run == ''
        run: |
          @'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const fixture = fs.mkdtempSync(path.join(os.tmpdir(), 'halo-ci-powershell-'));
          const windowsRoot = process.env.SystemRoot || process.env.WINDIR || 'C:\\Windows';
          const allowed = new Set(['SYSTEMROOT', 'WINDIR', 'COMSPEC', 'PATHEXT', 'OS', 'PROCESSOR_ARCHITECTURE']);
          const env = Object.fromEntries(Object.entries(process.env).filter(([key]) => allowed.has(key.toUpperCase())));
          Object.assign(env, { USERPROFILE: fixture, HOME: fixture, APPDATA: path.join(fixture, 'Roaming'), LOCALAPPDATA: path.join(fixture, 'Local'), TEMP: fixture, TMP: fixture, PI_OFFLINE: '1', PATH: [path.join(windowsRoot, 'System32'), path.join(windowsRoot, 'System32', 'WindowsPowerShell', 'v1.0')].join(path.delimiter) });
          for (const directory of [env.APPDATA, env.LOCALAPPDATA]) fs.mkdirSync(directory, { recursive: true });
          fs.writeFileSync(path.join(fixture, 'fixture.txt'), 'PowerShell ready');
          try {
            const shell = path.join(windowsRoot, 'System32', 'WindowsPowerShell', 'v1.0', 'powershell.exe');
            const args = ['-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-Command', "[IO.File]::ReadAllText((Join-Path (Get-Location) 'fixture.txt'))"];
            const started = Date.now();
            const result = spawnSync(shell, args, { cwd: fixture, env, encoding: 'utf8', windowsHide: true, timeout: 90000 });
            if (result.error) throw result.error;
            if (result.status !== 0 || !result.stdout.includes('PowerShell ready')) throw Error('PowerShell warmup failed: ' + result.stderr);
            console.log('Isolated Windows PowerShell warmup completed in ' + (Date.now() - started) + 'ms; regression retains its 15s limit');
          } finally {
            if (path.dirname(path.resolve(fixture)) !== path.resolve(os.tmpdir()) || !path.basename(fixture).startsWith('halo-ci-powershell-')) throw Error('Unexpected warmup directory');
            fs.rmSync(fixture, { recursive: true, force: true });
          }
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: inputs.reuse_run == ''
        run: npm run check
      - if: inputs.reuse_run == ''
        run: npm run lint
      - if: inputs.reuse_run == ''
        run: npm run test:regressions
      - name: Build installer without publishing
        if: inputs.reuse_run == ''
        run: npm run dist -- --publish never
      - name: Retain candidate before runtime verification
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-installer
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
  verify:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-dependencies
      - uses: actions/download-artifact@v4
        with:
          name: windows-candidate-installer
          path: dist
      - name: Provide a verified Chinese TrueType font
        run: |
          $ErrorActionPreference = 'Stop'
          $fontPath = Join-Path $env:RUNNER_TEMP 'NotoSansSC.ttf'
          # Official Google Fonts file pinned to an immutable commit and content hash.
          $fontUrl = 'https://raw.githubusercontent.com/google/fonts/2894aab31764f10f29c421bdfd2340d3b382d384/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf'
          Invoke-WebRequest -Uri $fontUrl -OutFile $fontPath
          if ((Get-FileHash -LiteralPath $fontPath -Algorithm SHA256).Hash -ne 'a3041811a78c361b1de50f953c805e0244951c21c5bd412f7232ef0d899af0da') { throw 'Chinese font checksum mismatch' }
          $env:HALO_DOCUMENT_FONT = $fontPath
          node -e "const font=require('fontkit').openSync(process.env.HALO_DOCUMENT_FONT); for(const c of '项目报告数据准确版式清晰文件可编辑') if(!font.hasGlyphForCodePoint(c.codePointAt(0))) throw Error('Chinese font glyph missing'); console.log('Verified Chinese TrueType font')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "HALO_DOCUMENT_FONT=$fontPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify the actual installer and update files
        run: node scripts/verify-release-artifacts.mjs
        env:
          HALO_PACKAGE_STAGE: ${{ runner.temp }}/halo-release-app-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Exercise the packaged app with isolated offline data
        run: |
          $report = Get-Content -LiteralPath 'test/results/release-artifacts.json' -Raw | ConvertFrom-Json
          $env:HALO_PACKAGED_EXE = $report.stagedExe
          node test/e2e/verify-packaged-runtimes.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/e2e/e2e-bundled-pi.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/e2e/verify-office-packaged.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/e2e/e2e-packaged-proxy.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/e2e/e2e-packaged-proxy.mjs --expect-direct
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/e2e/e2e-ui-motion.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain verified installer for upload-only retries
        uses: actions/upload-artifact@v4
        with:
          name: windows-verified-installer
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            test/results/release-artifacts.json
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-verification
          path: test/results/
          if-no-files-found: ignore
  upload:
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-verified-installer
      - name: Verify hashes and upload draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/upload-release.ps1

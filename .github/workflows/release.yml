name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate release version
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) throw Error('Tag must match package.json version')"
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - name: Build and upload release assets
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

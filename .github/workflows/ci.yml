name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provide a Chinese TrueType font for document regressions
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-arphic-gbsn00lp
          font="$(dpkg -L fonts-arphic-gbsn00lp | rg '/gbsn00lp\.ttf$' | head -n 1)"
          test -s "$font"
          printf 'HALO_DOCUMENT_FONT=%s\n' "$font" >> "$GITHUB_ENV"
      # 全量语法检查（ESM/CJS 混合，node --check 逐个验证）
      - run: npm run check
      # 注入脚本语法（离线验证 executeJavaScript 的字符串）
      - run: node test/check-touch-script.mjs
      # 静态检查
      - run: npm run lint
      # 离线功能回归：隔离会话/认证夹具，不需要模型账户或全局 pi SDK
      - run: npm run test:regressions
